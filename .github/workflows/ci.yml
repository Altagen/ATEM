# The checks every change goes through — the same script a developer runs
# (`pnpm check`), so a green CI means what a green laptop means.
#
# Actions are pinned by commit, each commit checked as signed by its publisher
# when pinned; Dependabot moves the pins. Every job gets only the permissions
# it needs.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
  # Dispatched by release.yml on the release pull request, which a pull
  # request opened by the workflow's own token would not trigger.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Gates, types and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      # The API tests create a throwaway database per run, on the port the
      # development set-up uses (scripts/api-tests.sh).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: atem
          POSTGRES_PASSWORD: atem
          POSTGRES_DB: atem
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U atem -d atem"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ./scripts/check-all.sh

  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The releases are written from these messages (release.yml): a commit
      # release-please cannot read is a change the changelog will not tell.
      - name: Every commit of the pull request is a conventional commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|style|revert)(\([a-z0-9._/-]+\))?!?: .+'
          bad=0
          while IFS= read -r line; do
            sha=${line%% *}; subject=${line#* }
            if ! grep -qE "$pattern" <<<"$subject"; then
              echo "::error::$sha is not a conventional commit: $subject"
              bad=1
            fi
          done < <(git log --no-merges --format='%h %s' "$BASE..$HEAD")
          exit "$bad"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Refuses a pull request that brings in a known vulnerability, or a
      # dependency whose license the AGPL cannot take in.
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: SSPL-1.0, BUSL-1.1, CC-BY-NC-4.0, CC-BY-NC-SA-4.0
          comment-summary-in-pr: on-failure

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    name: Images build and scan
    # The release path: a pull request to main, and main itself.
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: atem-api, file: Containerfile }
          - { name: atem-web, file: Containerfile.web }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image.file }}
          platforms: linux/amd64
          load: true
          tags: ${{ matrix.image.name }}:ci
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
      # A HIGH or CRITICAL vulnerability that has a fix fails the build: the
      # fix is to take it, usually a newer base image.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image.name }}:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
