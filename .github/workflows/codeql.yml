# Static analysis of the TypeScript, on every change and once a week — a new
# query can find something in code that has not moved.
name: CodeQL

on:
  push:
    branches: [develop, main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  # Dispatched by release.yml on the release pull request (see ci.yml).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:javascript-typescript
