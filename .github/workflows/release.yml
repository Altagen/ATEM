# Releases, from the conventional commits that reach main.
#
# On every push to main, release-please reads the commits since the last
# release and keeps a release pull request open: the next version (feat bumps
# the minor, fix the patch, `!` the major), the changelog section, the version
# in every package.json. Merging that pull request tags the version — no "v",
# `0.1.0` — and publishes the GitHub release with the section as its body.
# The images are then built for amd64 and arm64, scanned, pushed, and their
# SBOMs attached to the release. See docs/releasing.md.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request, or release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write # to run the checks on the release pull request, below
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # A pull request opened with the workflow's own token starts no workflow,
      # so the release pull request would wait for checks that never come and
      # main's rules would refuse it. A dispatched run is the exception GitHub
      # makes: the same checks, on the same commit, without a personal token.
      - name: Run the checks on the release pull request
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.release.outputs.pr }}
        run: |
          branch=$(jq -r '.headBranchName' <<<"$PR")
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          gh workflow run codeql.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"

  images:
    name: Publish ${{ matrix.image.name }}
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write # the SBOM, attached to the release
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: atem-api, file: Containerfile, title: ATEM API }
          - { name: atem-web, file: Containerfile.web, title: ATEM web }
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      # Image references are lowercase only, and the owner is not: the push
      # survived it (metadata-action lowercases), the SBOM step did not (0.1.0).
      - name: Name the image
        env:
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ matrix.image.name }}
        run: echo "IMAGE=ghcr.io/${OWNER,,}/${NAME}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Scanned first, on the amd64 build, before anything reaches the registry.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image.file }}
          platforms: linux/amd64
          load: true
          tags: ${{ matrix.image.name }}:scan
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image.name }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ needs.release-please.outputs.version }}
            type=raw,value=${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=${{ matrix.image.title }}
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.version=${{ needs.release-please.outputs.version }}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.image.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}
      # What the image is made of, in SPDX, beside the release: the images are
      # the only thing ATEM ships, so there is no archive to checksum.
      - uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: ${{ matrix.image.name }}-${{ env.VERSION }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attach the SBOM to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "${{ matrix.image.name }}-${VERSION}.spdx.json" --repo "$GITHUB_REPOSITORY" --clobber
