<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 860" role="img" aria-label="Card back">
  <!--
    ATEM's card back — the image shown when a card's artwork is missing or has
    not arrived yet, and the face every deck wears. Taken from the earlier prototype.

    Drawn rather than photographed: it stays sharp from a 35px thumbnail to a
    700px artwork, weighs two kilobytes and so shows at once — which is the
    moment it exists to cover — and it wears the project's palette instead of
    imitating the official back, which is not ours.

    Its 59:86 ratio is a real card's: the placeholder takes exactly the room the
    artwork will, with no jump in the layout when it lands.
  -->
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2130"/>
      <stop offset="0.5" stop-color="#121822"/>
      <stop offset="1" stop-color="#0d1119"/>
    </linearGradient>
    <linearGradient id="or" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5c542"/>
      <stop offset="1" stop-color="#b8892a"/>
    </linearGradient>
    <!-- A faint weave, so the surface is not flat. -->
    <pattern id="trame" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0 V28" stroke="#f5c542" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="590" height="860" rx="26" fill="url(#fond)"/>
  <rect width="590" height="860" rx="26" fill="url(#trame)"/>

  <!-- A double rule, like a card's border. -->
  <rect x="16" y="16" width="558" height="828" rx="18" fill="none"
        stroke="url(#or)" stroke-opacity="0.55" stroke-width="3"/>
  <rect x="30" y="30" width="530" height="800" rx="12" fill="none"
        stroke="#f5c542" stroke-opacity="0.18" stroke-width="1.5"/>

  <!-- The central diamond, from the emblem's motif. -->
  <g transform="translate(295 430)">
    <path d="M0 -168 L120 0 L0 168 L-120 0 Z" fill="none"
          stroke="url(#or)" stroke-opacity="0.85" stroke-width="4"/>
    <path d="M0 -108 L78 0 L0 108 L-78 0 Z" fill="none"
          stroke="#f5c542" stroke-opacity="0.35" stroke-width="2.5"/>
    <circle r="34" fill="none" stroke="url(#or)" stroke-opacity="0.9" stroke-width="4"/>
    <circle r="11" fill="#f5c542" fill-opacity="0.85"/>
  </g>

  <!-- Four corners, which give the scale even when tiny. -->
  <g fill="none" stroke="#f5c542" stroke-opacity="0.4" stroke-width="3" stroke-linecap="round">
    <path d="M52 96 V52 H96"/>
    <path d="M494 52 H538 V96"/>
    <path d="M538 764 V808 H494"/>
    <path d="M96 808 H52 V764"/>
  </g>

  <text x="295" y="736" text-anchor="middle" fill="#f5c542" fill-opacity="0.5"
        font-family="Plus Jakarta Sans, system-ui, sans-serif" font-size="46"
        font-weight="800" letter-spacing="14">ATEM</text>
</svg>
