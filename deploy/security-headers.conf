# The content security policy, in one place.
#
# It belongs to whatever serves `apps/web/dist`, not to the API: the API only
# returns JSON, and a policy set there would be decoration. `vite.config.ts`
# reads this very file, so development runs under the same policy and the
# end-to-end tests exercise it; `scripts/check-csp.mjs` checks it against what
# the application actually does.
#
# Each directive is justified. What is not justified has no business here.
#
#   default-src 'self'
#       Refusal by default. Anything not named below comes from our origin, or
#       does not come.
#
#   script-src 'self' 'wasm-unsafe-eval' blob:
#       No outside host. Tesseract, which does the OCR scan, used to come from
#       `cdn.jsdelivr.net`: third-party code running in our origin, able to call
#       the API on behalf of the signed-in person. It is served from our own
#       domain now, downloaded once and checked by fingerprint
#       (`scripts/vendor-tesseract.sh`). `wasm-unsafe-eval` and `blob:` stay:
#       that is what Tesseract needs to compile its WebAssembly and start its
#       worker.
#
#   worker-src 'self' blob:
#       Tesseract's worker is created from a blob URL.
#
#   connect-src 'self'
#       The API, the WebAssembly core and the language data: all on the same
#       origin. In development this also covers Vite's hot-reload socket, which
#       'self' matches on the same host.
#
#   img-src 'self' data: blob:
#       Card artworks come from /media, so from 'self' — they are downloaded
#       once and served by ATEM, never hot-linked. `data:` and `blob:` are the
#       camera's captures and the crops the OCR works on.
#
#   media-src 'self' blob:
#       The camera preview.
#
#   style-src 'self'
#       No inline style: the screens carry no `style="…"` attribute, and
#       `check-csp.mjs` fails if one appears. It is where the earlier prototype had to give
#       up — 363 of them — and the debt was never repaid.
#
#   font-src 'self'
#   object-src 'none'          — no plugin, ever.
#   base-uri 'self'            — without it, an injection rewrites every URL's base.
#   frame-ancestors 'none'     — nobody frames us.
#   form-action 'self'         — no form posts elsewhere.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; connect-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; style-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

# The headers that go with it, and depend on no route.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
# No screen asks for anything but the camera, and only the scanner does. What
# we do not use, we refuse.
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
