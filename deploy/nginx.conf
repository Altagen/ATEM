# Le front statique, et l'API derrière le même nom d'hôte.
#
# Servir les deux depuis la même origine supprime tout CORS et permet au cookie
# de session de rester `SameSite=Strict` : le navigateur ne voit qu'un seul site.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Les images de cartes ne changent jamais : elles portent un identifiant
    # dans leur nom. Un an de cache est sans risque et évite des milliers de
    # requêtes conditionnelles.
    location /media/ {
        proxy_pass http://api:3000/media/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Le front est une application à une seule page : toute route inconnue lui
    # est rendue, c'est elle qui décide s'il s'agit d'une page ou d'un 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
