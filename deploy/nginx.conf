# The static front, and the API behind the same host name.
#
# Serving both from the same origin removes any CORS and lets the session cookie
# stay `SameSite=Strict`: the browser sees a single site.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The front is a single-page application: every unknown route is handed to
    # it, and it decides whether that is a page or a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
