# The static front, and the API behind the same host name.
#
# Serving both from the same origin removes any CORS and lets the session cookie
# stay `SameSite=Strict`: the browser sees a single site.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The security headers, policy included. `add_header` does not accumulate:
    # a `location` that sets one of its own drops every header from this level,
    # so none of the blocks below sets any.
    include /etc/nginx/security-headers.conf;

    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        # `$http_host`, not `$host`: the latter drops the port, and the API's
        # origin guard compares the browser's `Origin` — which carries it — with
        # the `Host` it receives. On any public port other than 80 or 443 the two
        # never matched and **every write was refused**, sign-in included. That
        # is this file's own default (8080), so the shipped deployment was the
        # broken one. Measured by bringing the stack up: 403 “Origin not
        # allowed” on registration.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Card images, downloaded once by the API and kept on its disk. The API sends
    # `Cache-Control: immutable` itself — a passcode identifies a card and its
    # artwork never changes — and it is passed through untouched.
    location /media/ {
        proxy_pass http://api:3000/media/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite writes the content's fingerprint into the file name, so a changed file
    # is a different address: these can be cached for a year and never revalidated.
    # `expires` rather than `add_header Cache-Control`, which would drop every
    # security header inherited from the server block — measured, not assumed.
    location /assets/ {
        expires 1y;
    }

    # The shell names the fingerprinted files, so it must never be the stale one:
    # a cached `index.html` would ask for assets that no longer exist, and the
    # deployment would show a blank page until the cache expired. It is small, and
    # revalidating it costs one 304.
    location = /index.html {
        expires -1;
    }

    # The front is a single-page application: every unknown route is handed to
    # it, and it decides whether that is a page or a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
