# The full deployment, in one command.
#
# With the published images — all an instance needs is this file and a .env:
#   docker compose pull && docker compose up -d
# From the sources, in a clone of the repository:
#   docker compose up -d --build
#
# ATEM_VERSION picks the release (a tag such as 0.1.0); it defaults to the
# latest one. See docs/deployment.md.

services:
  db:
    # PostgreSQL starts as root to take ownership of its data directory, then
    # drops to the postgres user. Those four capabilities are what that needs —
    # everything else goes. Verified by bringing the stack up: initdb, the
    # health check and a migration all still pass.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: atem
      # Required, like the other secrets: a published default is not a password.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required — choose the database password}
      POSTGRES_DB: atem
    volumes:
      - atem_pg_data:/var/lib/postgresql/data
    ports:
      # Published on the loopback only: enough to inspect or back up the
      # database from the host machine, without ever exposing it to the network.
      - "127.0.0.1:${ATEM_DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atem -d atem"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Migrations run once, to completion, before the API starts. Without this
  # ordering, the API serves requests on an incomplete schema.
  migrate:
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # The API's image, run once with another command. The build line is the
    # API's too: a service without one may be pulled before the API's build
    # has tagged the image, and the second build reuses every cached layer.
    image: ghcr.io/altagen/atem-api:${ATEM_VERSION:-latest}
    build: { context: ., dockerfile: Containerfile }
    command: ["node", "dist/db/migrate.js"]
    environment:
      DATABASE_URL: postgres://atem:${POSTGRES_PASSWORD}@db:5432/atem
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    # Node needs no capability at all: it runs as an unprivileged user and binds
    # a port above 1024. A flaw in the application therefore has nothing to
    # escalate to.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    image: ghcr.io/altagen/atem-api:${ATEM_VERSION:-latest}
    build: { context: ., dockerfile: Containerfile }
    environment:
      DATABASE_URL: postgres://atem:${POSTGRES_PASSWORD}@db:5432/atem
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required — generate it with “openssl rand -base64 32”}
      # The one administrator, as code: the configuration wins at every start.
      ATEM_ADMIN_EMAIL: ${ATEM_ADMIN_EMAIL:?ATEM_ADMIN_EMAIL is required — the administrator's address}
      ATEM_ADMIN_PASSWORD: ${ATEM_ADMIN_PASSWORD:?ATEM_ADMIN_PASSWORD is required — 16+ characters, upper, lower, digit, special}
      ATEM_ADMIN_NAME: ${ATEM_ADMIN_NAME:-Admin}
      # On the compose network, the API must accept the proxy's connections:
      # 127.0.0.1 would only be reachable from its own container.
      ATEM_HOST: 0.0.0.0
      ATEM_PORT: 3000
      # Card images live on a volume: downloading them again after every
      # restart is exactly the repeated pull YGOPRODeck blacklists for.
      ATEM_MEDIA_DIR: /app/data/media
      # The proxy's address, so `X-Forwarded-For` is read and each visitor is
      # rate-limited on their own address. Without it every request looks like
      # it comes from nginx, the whole instance shares one bucket, and ten
      # failed sign-ins lock everyone out. The range is the one fixed below —
      # compose hands out a different address on every recreation, which is why
      # this is a subnet and not an address.
      ATEM_TRUSTED_PROXIES: ${ATEM_TRUSTED_PROXIES:-10.89.42.0/24}
      # The tunable ones, documented in .env.example, with the code's own
      # defaults: without these lines they were settable in .env and read by
      # nobody — found on 2026-09-22, when the release test hit the sign-up
      # ceiling it was meant to loosen.
      ATEM_REGISTER_ATTEMPTS_MAX: ${ATEM_REGISTER_ATTEMPTS_MAX:-5}
      ATEM_LOGIN_ATTEMPTS_MAX: ${ATEM_LOGIN_ATTEMPTS_MAX:-10}
      ATEM_DISK_RESERVE_BYTES: ${ATEM_DISK_RESERVE_BYTES:-209715200}
      ATEM_DB_POOL: ${ATEM_DB_POOL:-10}
    volumes:
      - atem_media:/app/data/media
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    # nginx binds port 80 — privileged — then drops its workers to the nginx
    # user, which is what the other three allow. Nothing more.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cap_add: [CHOWN, NET_BIND_SERVICE, SETGID, SETUID]
    image: ghcr.io/altagen/atem-web:${ATEM_VERSION:-latest}
    build: { context: ., dockerfile: Containerfile.web }
    ports:
      - "${ATEM_PUBLIC_PORT:-8080}:80"
    depends_on:
      api: { condition: service_healthy }

volumes:
  atem_pg_data:
  atem_media:

# Fixed so `ATEM_TRUSTED_PROXIES` can name it. Compose would otherwise pick a
# range at creation time, different on another machine — and the variable would
# be wrong exactly where nobody looks.
networks:
  default:
    ipam:
      config:
        - subnet: 10.89.42.0/24
